<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>후기 작성 | 과목노트</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">

  <style>
    :root {
      color-scheme: light;
      --bg: #EFE7D8;
      --surface: #FBF8F2;
      --ink: #2B2620;
      --muted: #8A8171;
      --teal: #3F5F55;
      --amber: #C98A3E;
      --line: #DDD3BE;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:'PretendardVariable', -apple-system, 'Apple SD Gothic Neo', sans-serif; line-height:1.6; }
    h1,h2 { font-family:'Noto Serif KR', Georgia, serif; color:var(--teal); margin:0; }
    .wrap { max-width:640px; margin:0 auto; padding:0 20px; }
    .site-header { padding:20px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .logo { font-family:'Noto Serif KR', Georgia, serif; font-weight:700; font-size:20px; color:var(--teal); text-decoration:none; }
    .back-link { font-size:14px; color:var(--muted); text-decoration:none; }

    .page-head { padding:28px 0 4px; }
    .page-head h1 { font-size:24px; }
    .sample-note { margin-top:8px; color:var(--muted); font-size:13px; }

    form { padding:20px 0 60px; display:flex; flex-direction:column; gap:18px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field label { font-size:14px; font-weight:600; }
    .field .hint { font-size:12px; color:var(--muted); }
    input, select, textarea {
      font-family:inherit; font-size:15px; color:var(--ink);
      background:var(--surface); border:1px solid var(--line); border-radius:8px;
      padding:10px 12px; width:100%;
    }
    textarea { min-height:70px; resize:vertical; }
    .readonly-box {
      background:var(--surface); border:1px solid var(--line); border-radius:8px;
      padding:10px 12px; color:var(--muted); font-size:15px;
    }

    .submit-btn {
      margin-top:8px; padding:14px 24px; background:var(--amber); color:#FFFFFF;
      font-weight:600; border:none; border-radius:8px; font-size:15px; cursor:pointer;
    }
    .submit-btn:active { opacity:0.85; }

    .done-msg {
      display:none; margin-top:16px; padding:14px 16px; background:var(--surface);
      border:1px solid var(--line); border-radius:8px; color:var(--teal); font-size:14px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrap" style="display:flex; align-items:center; justify-content:space-between;">
      <a class="logo" href="index.html">과목노트</a>
      <a class="back-link" href="economy.html">← 경제 페이지로</a>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <h1>후기 작성하기</h1>
      <p class="sample-note">
        지금은 테스트 단계라, 작성한 후기는 <strong>이 기기(브라우저)에만</strong> 저장돼요.
        다른 친구 휴대폰에서는 보이지 않아요. 여러 사람이 쓴 후기를 다 같이 보려면
        다음 단계에서 실제 데이터베이스를 연결해야 합니다.
      </p>
    </div>

    <form id="review-form">
      <div class="field">
        <label>과목</label>
        <div class="readonly-box">경제</div>
      </div>

      <div class="field">
        <label for="grade">작성 학년</label>
        <select id="grade" required>
          <option value="">선택하세요</option>
          <option value="1학년">1학년</option>
          <option value="2학년">2학년</option>
          <option value="3학년">3학년</option>
        </select>
      </div>

      <div class="field">
        <label for="year">수강 연도</label>
        <input type="number" id="year" placeholder="예: 2025" min="2020" max="2030" required>
      </div>

      <div class="field">
        <label for="rating">별점</label>
        <select id="rating" required>
          <option value="">선택하세요</option>
          <option value="5">★★★★★ (매우 만족)</option>
          <option value="4">★★★★☆</option>
          <option value="3">★★★☆☆</option>
          <option value="2">★★☆☆☆</option>
          <option value="1">★☆☆☆☆ (아쉬움)</option>
        </select>
      </div>

      <div class="field">
        <label for="summary">한줄평</label>
        <input type="text" id="summary" placeholder="예: 생각보다 수행평가 부담이 컸다" required>
      </div>

      <div class="field">
        <label for="classReview">수업 후기</label>
        <textarea id="classReview" placeholder="수업 분위기, 진행 방식 등을 적어주세요"></textarea>
      </div>

      <div class="field">
        <label for="examReview">시험 후기</label>
        <textarea id="examReview" placeholder="시험 난이도, 출제 유형 등을 적어주세요"></textarea>
      </div>

      <div class="field">
        <label for="paReview">수행평가 후기</label>
        <textarea id="paReview" placeholder="수행평가 종류, 부담 정도를 적어주세요"></textarea>
      </div>

      <div class="field">
        <label for="studyMethod">공부법</label>
        <textarea id="studyMethod" placeholder="어떻게 공부했는지 적어주세요"></textarea>
      </div>

      <div class="field">
        <label for="recommend">추천 대상</label>
        <input type="text" id="recommend" placeholder="예: 경제 뉴스에 관심 있는 학생">
      </div>

      <button type="submit" class="submit-btn">후기 등록하기</button>
      <p id="done-msg" class="done-msg">등록됐어요! 경제 페이지로 이동합니다…</p>
    </form>
  </main>

  <script>
    // 후기 작성 폼: 제출하면 이 브라우저의 localStorage에 저장하고 경제 페이지로 이동
    document.getElementById('review-form').addEventListener('submit', function (e) {
      e.preventDefault(); // 페이지가 새로고침되지 않도록 막음

      var newReview = {
        grade: document.getElementById('grade').value,
        year: document.getElementById('year').value,
        rating: Number(document.getElementById('rating').value),
        summary: document.getElementById('summary').value,
        classReview: document.getElementById('classReview').value,
        examReview: document.getElementById('examReview').value,
        paReview: document.getElementById('paReview').value,
        studyMethod: document.getElementById('studyMethod').value,
        recommend: document.getElementById('recommend').value
      };

      // 기존에 저장된 후기 목록을 가져와서 새 후기를 추가
      var saved = JSON.parse(localStorage.getItem('reviews_economy') || '[]');
      saved.push(newReview);
      localStorage.setItem('reviews_economy', JSON.stringify(saved));

      document.getElementById('done-msg').style.display = 'block';
      setTimeout(function () {
        window.location.href = 'economy.html';
      }, 900);
    });
  </script>

</body>
</html>
